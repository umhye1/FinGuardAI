services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finguard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: finguard
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: finguard-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: