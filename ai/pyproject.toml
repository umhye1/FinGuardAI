[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "psycopg[binary,pool]>=3.2,<4", "numpy>=1.26,<3",
  "scikit-learn>=1.6,<2"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
finguard-train = "finguard_ai.training:train_main"
finguard-evaluate = "finguard_ai.training:evaluate_main"
finguard-index = "finguard_ai.indexing:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires isolated PostgreSQL via TEST_DATABASE_URL"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
