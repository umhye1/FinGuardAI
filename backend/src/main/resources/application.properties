spring.application.name=finguard-api

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/finguard
spring.datasource.username=finguard
spring.datasource.password=finguard
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=finguard-secret-key-finguard-secret-key-1234567890
jwt.expiration=3600000

ai.server-url=http://localhost:8000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.jpa.open-in-view=false