spring.application.name=finguard-api

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/finguard
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=1209600000
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
jobs.worker.enabled=true

ai.server-url=http://localhost:8000
ai.enabled=false
ai.service-token=${AI_SERVICE_TOKEN:}
ai.timeout-ms=5000
ai.rag-timeout-ms=15000
