name: 버그 수정
description: 재현 가능한 결함을 등록합니다.
title: "[Fix] "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 재현 절차
      description: 입력, 실행 단계, 실제 결과를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 수정 후 확인할 테스트와 회귀 조건을 작성합니다.
      value: "- [ ] "
    validations:
      required: true
