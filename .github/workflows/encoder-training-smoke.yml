name: Encoder training smoke
on:
  pull_request:
    paths: ['ai/src/finguard_ai/encoder*', 'ai/src/finguard_ai/benchmark_data.py', 'ai/tests/test_encoder*', 'ai/requirements-encoder.txt', '.github/workflows/encoder-training-smoke.yml']
permissions:
  contents: read
jobs:
  train-reload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ai/requirements.lock
            ai/requirements-encoder.txt
      - run: python -m pip install -c requirements.lock -e '.[test]'
      - name: Install CPU-only optional training dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-encoder.txt
      - name: Test tiny local BERT gradients and checkpoint reload (no pretrained downloads)
        run: python -m pytest tests/test_encoder_data.py tests/test_encoder_training.py -q
