name: RAG routing regression
on:
  pull_request:
    paths: ['ai/**', '.github/workflows/rag-routing-regression.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[test]'
      - run: python -m ruff check .
      - run: python -m pytest -m 'not integration' -q
      - run: python scripts/topic_routing_report.py --output .artifacts/topic-routing-v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: topic-routing-regressions
          path: ai/.artifacts/topic-routing-v2.json
          retention-days: 14
