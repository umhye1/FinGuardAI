name: AI offline evaluation

on:
  pull_request:
    paths: ['ai/**', 'backend/src/main/resources/db/migration/**', '.github/workflows/ai-offline-evaluation.yml']
  push:
    branches: ['main', 'dev', 'feat/**', 'fix/**']
    paths: ['ai/**', 'backend/src/main/resources/db/migration/**', '.github/workflows/ai-offline-evaluation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[test]'
      - run: python -m ruff check .
      - run: python -m pytest -m 'not integration' -q
      - name: Compare classifiers without provider calls
        run: >-
          python -m finguard_ai.context_benchmark --data data/benchmarks/context-v1
          --output-dir .artifacts/context-v1 --allow-synthetic
      - name: Evaluate retrieval without generation
        run: >-
          python -m finguard_ai.rag_benchmark --data data/benchmarks/rag-v1
          --corpus data/official --output-dir .artifacts/rag-v1
      - uses: actions/upload-artifact@v4
        with:
          name: offline-ai-reports
          path: |
            ai/.artifacts/context-v1/classification-report.json
            ai/.artifacts/rag-v1/rag-report.json
            ai/.artifacts/rag-v1/faithfulness-review.template.json
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: finguard_ai_test
          POSTGRES_PASSWORD: isolated-ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d finguard_ai_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: ai
    env:
      TEST_DATABASE_URL: postgresql://postgres:isolated-ci-test-only@127.0.0.1:5432/finguard_ai_test
      INCREMENTAL_REPORT_DIR: .artifacts/incremental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.lock
      - run: python -m pip install -c requirements.lock -e '.[test]'
      - run: python -m pytest -m integration -q
      - uses: actions/upload-artifact@v4
        with:
          name: incremental-offline-reports
          path: ai/.artifacts/incremental
          retention-days: 14
